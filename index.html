<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friisberg Organizacijos Diagnostika</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Ubuntu:wght@300;400;500;700&display=swap">
<style>
/* Layout: one centred column (max 760px) for the respondent flow; a wider (1100px) working area for the consultant backend. Brand: Friisberg navy + magenta, Marcellus headings, Ubuntu body. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#2E3138; --ink-2:#5C6472; --muted:#8A93A3;
  --navy:#00286C; --navy-ink:#00286C; --magenta:#FF0084; --blue:#0074DB; --line:#C9CFD8; --line-2:#E3E6EC;
  --good:#1E8E4B; --warn:#D98A00; --crit:#C8323B; --mid:#0074DB;
  --font-display:'Marcellus',Georgia,'Times New Roman',serif; --font-body:'Ubuntu','Helvetica Neue',Arial,sans-serif;
  --radius:6px; --shadow:0 1px 2px rgba(0,40,108,.06),0 6px 20px rgba(0,40,108,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172036; --surface-2:#1F2A45; --ink:#E7EAF0; --ink-2:#B3BBC9; --muted:#8792A6;
  --navy:#00286C; --navy-ink:#A9C0F2; --magenta:#FF4DA6; --blue:#4F9EF0; --line:#2E3A58; --line-2:#263150;
  --good:#4CC472; --warn:#F2B344; --crit:#F0636B; --mid:#4F9EF0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172036; --surface-2:#1F2A45; --ink:#E7EAF0; --ink-2:#B3BBC9; --muted:#8792A6;
  --navy:#00286C; --navy-ink:#A9C0F2; --magenta:#FF4DA6; --blue:#4F9EF0; --line:#2E3A58; --line-2:#263150;
  --good:#4CC472; --warn:#F2B344; --crit:#F0636B; --mid:#4F9EF0; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;color:var(--navy-ink);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.7rem,4vw,2.4rem)} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);font-weight:500}
.muted{color:var(--ink-2)} .small{font-size:.85rem}
.tabular{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.brand-mark{width:34px;height:34px;border-radius:50%;border:2px solid #fff;position:relative;flex:none;overflow:hidden}
.brand-mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from 200deg,#FF0084 0 35%,transparent 35% 100%)}
.brand-name{font-family:var(--font-display);letter-spacing:.06em;font-size:.95rem;line-height:1.1}
.brand-name small{display:block;font-family:var(--font-body);font-size:.62rem;letter-spacing:.2em;opacity:.8}
.topbar nav{display:flex;gap:6px;flex-wrap:wrap}
.topbar nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-size:.82rem}
.topbar nav button[aria-current="true"]{background:#fff;color:var(--navy);border-color:#fff}
.topbar nav button:focus-visible,button:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap.wide{max-width:1100px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
@media (max-width:480px){.card{padding:20px}}
.stack{display:grid;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:4px;padding:11px 22px;font-weight:500;font-size:.95rem;letter-spacing:.02em;transition:background .15s}
.btn:hover{background:#003a94}
.btn.ghost{background:transparent;color:var(--navy-ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.accent{background:var(--magenta);border-color:var(--magenta)}
.btn.accent:hover{background:#d9006f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:.85rem}

/* intro */
.hero{display:grid;gap:18px}
.hero-rule{height:3px;width:56px;background:var(--magenta)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px}
.fact{border-top:1px solid var(--line);padding-top:10px}
.fact b{display:block;font-family:var(--font-display);font-size:1.5rem;color:var(--navy-ink);font-weight:400}
.fact span{font-size:.82rem;color:var(--ink-2)}

/* choice grids */
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--ink);transition:border-color .15s,background .15s;min-width:0}
.choice:hover{border-color:var(--blue)}
.choice[aria-pressed="true"]{border-color:var(--navy-ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--navy-ink)}
.choice .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:3px;position:relative}
.choice[aria-pressed="true"] .dot{border-color:var(--navy-ink)}
.choice[aria-pressed="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--magenta)}
.choice b{display:block;font-weight:500}
.choice small{display:block;color:var(--ink-2);font-size:.82rem;margin-top:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.88rem;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-size:.72rem;opacity:.75}
.chip:disabled{opacity:.4;cursor:not-allowed}

/* question */
.progress{height:4px;background:var(--line-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--magenta);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--ink-2);flex-wrap:wrap}
.qtext{font-size:1.25rem;line-height:1.4;color:var(--ink);font-weight:400}
.answers{display:grid;gap:10px}
.answer{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--ink);display:flex;gap:14px;align-items:center;transition:border-color .15s,transform .05s}
.answer:hover{border-color:var(--navy-ink)}
.answer:active{transform:scale(.995)}
.answer .k{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:var(--ink-2);flex:none}
.answer[aria-pressed="true"]{border-color:var(--navy-ink);background:var(--surface-2)}
.answer[aria-pressed="true"] .k{background:var(--navy);color:#fff;border-color:var(--navy)}
.branch-note{font-size:.8rem;color:var(--ink-2);border-left:2px solid var(--magenta);padding-left:10px}

/* result */
.score-hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring-c,var(--navy)) calc(var(--p,0)*1%),var(--line-2) 0);flex:none}
.ring i{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem;color:var(--navy-ink);font-style:normal}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.bar .lbl{font-size:.9rem;min-width:0}
.bar .val{font-size:.85rem;color:var(--ink-2);text-align:right;white-space:nowrap}
.bar .track{grid-column:1/-1;height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:4px;background:var(--bar-c,var(--navy))}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--pill,var(--navy))}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:12px;word-break:break-all;user-select:all;max-height:120px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* backend */
.subnav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:24px}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--ink-2);font-size:.9rem;margin-bottom:-1px}
.subnav button[aria-current="true"]{color:var(--navy-ink);border-bottom-color:var(--magenta);font-weight:500}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;counter-reset:step}
.flow .step{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:14px;position:relative;min-width:0}
.flow .step::before{counter-increment:step;content:counter(step);position:absolute;top:-10px;left:12px;background:var(--magenta);color:#fff;font-size:.7rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:500}
.flow .step h3{font-size:1rem;margin-top:4px;margin-bottom:6px}
.flow .step p{font-size:.82rem;color:var(--ink-2)}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.rule{border-left:3px solid var(--navy-ink);background:var(--surface);padding:12px 14px;border-radius:0 var(--radius) var(--radius) 0;border-top:1px solid var(--line-2);border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.rule b{display:block;font-weight:500;margin-bottom:4px}
.rule p{font-size:.85rem;color:var(--ink-2)}
.rule.m{border-left-color:var(--magenta)}

.tree{display:grid;gap:14px}
.tnode{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius);padding:14px 16px}
.tnode-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.tnode-h h3{font-size:1.05rem}
.tag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.gate{border-color:var(--navy-ink);color:var(--navy-ink)} .tag.verify{border-color:var(--good);color:var(--good)} .tag.drill{border-color:var(--magenta);color:var(--magenta)} .tag.core{border-color:var(--blue);color:var(--blue)}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.br{border-top:2px solid var(--line);padding-top:10px}
.br.yes{border-top-color:var(--good)} .br.no{border-top-color:var(--magenta)}
.br .cond{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-bottom:6px}
.br.yes .cond{color:var(--good)} .br.no .cond{color:var(--magenta)}
.qline{font-size:.86rem;padding:6px 0 6px 12px;border-left:1px solid var(--line);margin-left:4px;color:var(--ink)}
.qline .id{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);margin-right:6px}
.gateq{font-size:.95rem;margin-top:6px}
.gateq .id{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:var(--muted);margin-right:6px}

.tablewrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--ink-2);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);position:sticky;top:0}
td.c,th.c{text-align:center}
.mx{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:transparent;display:inline-grid;place-items:center}
.mx[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mx::after{content:"✓";font-size:.8rem}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:12px 14px}
.kpi b{display:block;font-family:var(--font-display);font-size:1.5rem;font-weight:400;color:var(--navy-ink)}
.kpi span{font-size:.78rem;color:var(--ink-2)}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line-2)}
.dist i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.hint{background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;font-size:.86rem;color:var(--ink-2)}
footer{max-width:1100px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px));font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.78rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="https://friisberg.com" target="_blank" rel="noopener"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">FRIISBERG &amp; PARTNERS<small>INTERNATIONAL</small></span></a>
    <nav aria-label="Vaizdas"><button id="nav-survey" aria-current="true">Klausimynas</button><button id="nav-backend" aria-current="false">Metodika (konsultantui)</button></nav>
  </div>
</header>

<main id="survey" class="wrap"></main>
<main id="backend" class="wrap wide" hidden></main>
<footer><span>Organizacijos diagnostika · Friisberg &amp; Partners · v1 (2026)</span><span>Klausimų bankas: Audito klausimynas v1 (2024-10-31)</span></footer>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===================== DATA ===================== */
/* ===================== CONFIG ===================== */
const ENDPOINT = ''; // Google Apps Script Web app URL (žr. README.md). Tuščia = atsakymai perduodami kodu.
const ORG_PARAM = (new URLSearchParams(location.search).get('org')||'').trim();

/* ===================== THE ALGORITHM ===================== */
/* Builds the question path for a profile given the answers so far. Pure: same inputs → same path. */
function buildPath(profile, answers){
  const path=[]; const seen=new Set();
  const push=(id,role,topic,why)=>{ if(seen.has(id)||!allowed(id,profile)) return; seen.add(id); path.push({id,role,topic,why}) };
  CORE.forEach(id=>push(id,'core','core','Vadovų komandos blokas – atsako visi'));
  const depth = profile.depth ?? 3;
  profile.topics.forEach(tk=>{
    const t=TOPICS[tk]; push(t.gate,'gate',tk,'Vartų klausimas');
    const a=answers[t.gate]; if(a===undefined) return;            // tree stops here until the gate is answered
    const score=BY[t.gate].opts[a][1];
    if(score===1) push(t.verify,'verify',tk,'Vartai = „pilnai“ → viena patikra');
    else t.drill.slice(0,depth).forEach(id=>push(id,'drill',tk,'Vartai = „iš dalies / ne“ → gilinimasis'));
  });
  return path;
}
/* Worst/best-case counts for the backend simulation */
function simulate(roleId, size, board){
  const m=matrix(); const topics=m[roleId]; const r=ROLES.find(x=>x.id===roleId); const depth=r.depth??3;
  const prof={size,board,topics,depth};
  const core=CORE.filter(id=>allowed(id,prof)).length;
  let best=core, worst=core;
  topics.forEach(tk=>{ const t=TOPICS[tk]; best+=1+ (allowed(t.verify,prof)?1:0); worst+=1+t.drill.slice(0,depth).filter(id=>allowed(id,prof)).length; });
  return {best,worst:Math.max(best,worst),core};
}
function scoreByTopic(profile, answers){
  const out={}; const path=buildPath(profile,answers);
  path.forEach(p=>{ const a=answers[p.id]; if(a===undefined) return; const o=out[p.topic]||(out[p.topic]={got:0,max:0,n:0}); o.got+=BY[p.id].opts[a][1]; o.max+=1; o.n++; });
  return out;
}
function encodeResult(profile, answers){
  const payload={v:1,r:profile.role,s:profile.size,b:profile.board?1:0,t:profile.topics,a:answers,d:new Date().toISOString().slice(0,10)};
  return 'FBA1-'+btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeResult(code){
  const m=String(code).trim().match(/FBA1-([A-Za-z0-9_-]+)/); if(!m) return null;
  try{ const b=m[1].replace(/-/g,'+').replace(/_/g,'/'); const json=decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4)))); const p=JSON.parse(json);
    const role=ROLES.find(r=>r.id===p.r); return {role:p.r,size:p.s,board:!!p.b,topics:p.t,depth:role?.depth??3,answers:p.a,date:p.d}; }catch(e){ return null }
}

      <div class="step"><h3>Sritys</h3><p>Vaidmuo parenka 4 sritis iš 15 (matrica). Vadovas gali jas pakeisti – paliekamos tik tos, kurias jis išmano. Riba: ${MIN_TOPICS}–${MAX_TOPICS}.</p></div>
      <div class="step"><h3>Komandos blokas</h3><p>${CORE.length} klausimai apie vadovų komandos veikimą – po vieną iš kiekvienos potemės. Juos atsako visi, todėl matome sutarimą ir išsibarstymą.</p></div>
      <div class="step"><h3>Vartų klausimas</h3><p>Kiekviena sritis prasideda vienu diagnostiniu klausimu. Jo atsakymas nulemia, kur medis šakojasi.</p></div>
      <div class="step"><h3>Šaka</h3><p><b>Pilnai atitinka</b> → 1 patikros klausimas (pasitikime, bet patikriname). <b>Iš dalies / ne</b> → 2–3 gilinimosi klausimai, kad suprastume spragos priežastį.</p></div>
      <div class="step"><h3>Balas</h3><p>Atsakymai vertinami 1 / 0,5 / 0 kaip Excel klausimyne. Srities branda = surinkta ÷ galima. Kodas persiunčiamas konsultantui ir agreguojamas komandos lygiu.</p></div>
    </div>
    <div class="rule-grid">
      <div class="rule"><b>Kodėl 10 minučių</b><p>Vietoje 150 klausimų vadovas atsako 16–24. Skaičiuojame po ${SEC_PER_Q} s klausimui.</p></div>
      <div class="rule m"><b>Kodėl patikra, kai „pilnai“</b><p>Vadovai linkę pervertinti savo sritį. Vienas konkretus įgyvendinimo klausimas rodo, ar praktika tikrai veikia.</p></div>
      <div class="rule"><b>Kodėl gilinimasis, kai „ne“</b><p>Spragos priežastis būna skirtinga: nėra strategijos, nėra įrankio ar nėra disciplinos. Gilinimosi klausimai parinkti iš skirtingų kategorijų.</p></div>
      <div class="rule m"><b>HR vadovui – kitaip</b><p>HR atsako visas 15 sričių, bet gilinimasis ribojamas 1 klausimu. Tai ilgiausias kelias (~15 min) ir atskaitos taškas kitų vadovų atsakymams.</p></div>
      <div class="rule"><b>Brandos lygiai</b><p>${BANDS.map(b=>`${b.name} ≥${b.min}%`).join(' · ')}. Pagal Excel „Sheet1“ aprašą.</p></div>
      <div class="rule m"><b>Klausimų banko panaudojimas</b><p>Medyje naudojami ${used.size} iš ${BANK.length} klausimų. Likusieji liko HR lygio detalėms – matomi skiltyje „Klausimų bankas“.</p></div>
    </div>
    <div><h3>Simuliacija pagal vaidmenį</h3><p class="small muted">Vidutinė organizacija (50–199) su valdyba. Geriausias atvejis: visi vartai „pilnai“. Blogiausias: visi vartai „iš dalies / ne“.</p></div>
    <div class="tablewrap"><table><thead><tr><th>Vaidmuo</th><th class="c">Sritys</th><th class="c">Komandos kl.</th><th class="c">Klausimų</th><th class="c">Laikas</th></tr></thead><tbody>${sims}</tbody></table></div>
  </div>`;
}
function renderTree(){
  const m=matrix(); const role=ROLES.find(r=>r.id===B.role); const prof={size:B.size,board:B.board,topics:m[B.role],depth:role.depth??3};
  const cond=id=>CONDITIONS[id]?`<span class="tag">${allowed(id,prof)?'įjungta':'praleista'}: ${esc(CONDITIONS[id].label)}</span>`:'';
  const core=`<div class="tnode"><div class="tnode-h"><h3>Vadovų komandos blokas</h3><span class="tag core">Visiems · ${CORE.filter(id=>allowed(id,prof)).length} kl.</span></div>
    ${CORE.map(id=>`<div class="qline" style="${allowed(id,prof)?'':'opacity:.45'}"><span class="id">${id}</span>${esc(BY[id].tema)}: ${esc(BY[id].q)} ${cond(id)}</div>`).join('')}</div>`;
  const topics=prof.topics.map(tk=>{const t=TOPICS[tk];return `<div class="tnode">
    <div class="tnode-h"><h3>${esc(t.name)}</h3><span class="tag gate">Vartai</span></div>
    <p class="gateq"><span class="id">${t.gate}</span>${esc(qText(t.gate,prof))}</p>
    <p class="small muted">Atsakymai: ${BY[t.gate].opts.map(o=>`${esc(o[0])} (${o[1]})`).join(' · ')}</p>
    <div class="branches">
      <div class="br yes"><div class="cond">Jei „${esc(BY[t.gate].opts[0][0])}“ (1) → patikra</div><div class="qline"><span class="id">${t.verify}</span>${esc(qText(t.verify,prof))} ${cond(t.verify)}</div></div>
      <div class="br no"><div class="cond">Jei 0,5 arba 0 → gilinimasis (${t.drill.slice(0,prof.depth).length} kl.)</div>${t.drill.slice(0,prof.depth).map(id=>`<div class="qline" style="${allowed(id,prof)?'':'opacity:.45'}"><span class="id">${id}</span>${esc(qText(id,prof))} ${cond(id)}</div>`).join('')}</div>
    </div></div>`}).join('');
  const s=simulate(B.role,B.size,B.board);
  return `<div class="stack">
    <div class="row"><label class="small muted">Vaidmuo <select id="t-role">${ROLES.map(r=>`<option value="${r.id}" ${B.role===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>
      <label class="small muted">Dydis <select id="t-size">${SIZES.map(x=>`<option value="${x.id}" ${B.size===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label>
      <label class="small muted">Valdyba <select id="t-board"><option value="1" ${B.board?'selected':''}>Yra</option><option value="0" ${!B.board?'selected':''}>Nėra</option></select></label>
      <span class="small tabular">Kelias: ${s.best}–${s.worst} kl. · ${fmtMin(s.best*SEC_PER_Q)}–${fmtMin(s.worst*SEC_PER_Q)}</span></div>
    <div class="tree">${core}${topics}</div>
    <div class="legend"><span><i style="background:var(--blue)"></i>Komandos blokas</span><span><i style="background:var(--navy-ink)"></i>Vartų klausimas</span><span><i style="background:var(--good)"></i>Patikra (kai pilnai)</span><span><i style="background:var(--magenta)"></i>Gilinimasis (kai iš dalies / ne)</span></div>
  </div>`;
}
function renderMatrix(){
  const m=matrix(); const keys=Object.keys(TOPICS);
  const head=`<tr><th>Vaidmuo</th>${keys.map(k=>`<th class="c" title="${esc(TOPICS[k].name)}">${esc(TOPICS[k].name.split(' ')[0])}</th>`).join('')}<th class="c">Iš viso</th></tr>`;
  const rows=ROLES.map(r=>`<tr><td>${esc(r.name)}</td>${keys.map(k=>`<td class="c"><button class="mx" data-r="${r.id}" data-t="${k}" aria-pressed="${m[r.id].includes(k)}" aria-label="${esc(r.name)}: ${esc(TOPICS[k].name)}"></button></td>`).join('')}<td class="c tabular">${m[r.id].length}</td></tr>`).join('');
  const cover=keys.map(k=>`<tr><td>${esc(TOPICS[k].name)}</td><td class="c tabular">${ROLES.filter(r=>m[r.id].includes(k)).length}</td><td>${esc(ROLES.filter(r=>m[r.id].includes(k)).map(r=>r.name.split(' /')[0]).join(', '))}</td></tr>`).join('');
  return `<div class="stack">
    <p class="small muted">Kuris vaidmuo kurias sritis gauna pagal nutylėjimą. Spustelėkite langelį, kad pakeistumėte – pakeitimas iškart galioja klausimynui šioje naršyklėje. Vadovas vis tiek gali koreguoti sritis pats.</p>
    <div class="tablewrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="row"><button class="btn ghost sm" id="mx-reset">Atstatyti numatytuosius</button><span class="small muted">${ls.get('fba_matrix',null)?'Naudojama Jūsų pakeista matrica.':'Naudojama numatytoji matrica.'}</span></div>
    <div><h3>Sričių padengimas komandoje</h3><p class="small muted">Kiek vaidmenų vertina kiekvieną sritį. Sritis, kurią vertina 2+ vadovai, leidžia lyginti požiūrius.</p></div>
    <div class="tablewrap"><table><thead><tr><th>Sritis</th><th class="c">Vaidmenų</th><th>Kas vertina</th></tr></thead><tbody>${cover}</tbody></table></div>
  </div>`;
}
function roleInTree(id){
  if(CORE.includes(id)) return ['core','Komandos blokas'];
  for(const [k,t] of Object.entries(TOPICS)){ if(t.gate===id) return ['gate','Vartai · '+t.name]; if(t.verify===id) return ['verify','Patikra · '+t.name]; if(t.drill.includes(id)) return ['drill','Gilinimasis · '+t.name]; }
  return ['', 'Nenaudojamas'];
}
function renderBank(){
  const temas=[...new Set(BANK.map(q=>q.tema))];
  const list=BANK.filter(q=>(!B.filterTema||q.tema===B.filterTema)&&(!B.filterRole||roleInTree(q.id)[0]===B.filterRole));
  const rows=list.map(q=>{const [cls,lab]=roleInTree(q.id);return `<tr><td class="tabular"><span class="id" style="font-family:ui-monospace,Menlo,monospace;font-size:.75rem">${q.id}</span></td><td>${esc(q.tema)}</td><td class="small">${esc(q.kat)}</td><td>${esc(q.q)}${CONDITIONS[q.id]?`<br><span class="tag">${esc(CONDITIONS[q.id].label)}</span>`:''}</td><td class="small">${q.opts.map(o=>`${esc(o[0])} <span class="muted">(${o[1]})</span>`).join('<br>')}</td><td class="small">${[q.top?'Top':'',q.vad?'Vad.':'',q.hr?'HR':''].filter(Boolean).join(' · ')}</td><td><span class="tag ${cls}">${esc(lab)}</span></td></tr>`}).join('');
  return `<div class="stack">
    <div class="row"><label class="small muted">Tema <select id="f-tema"><option value="">Visos</option>${temas.map(t=>`<option ${B.filterTema===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
      <label class="small muted">Vaidmuo medyje <select id="f-role"><option value="">Visi</option><option value="core" ${B.filterRole==='core'?'selected':''}>Komandos blokas</option><option value="gate" ${B.filterRole==='gate'?'selected':''}>Vartai</option><option value="verify" ${B.filterRole==='verify'?'selected':''}>Patikra</option><option value="drill" ${B.filterRole==='drill'?'selected':''}>Gilinimasis</option><option value="" disabled>──</option></select></label>
      <span class="small muted tabular">${list.length} iš ${BANK.length} klausimų</span></div>
    <div class="tablewrap"><table><thead><tr><th>ID</th><th>Tema</th><th>Kategorija</th><th>Klausimas</th><th>Atsakymai (balas)</th><th>Excel: kam</th><th>Vaidmuo medyje</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}
function renderAgg(){
  // remote rows: newest per respondent id, filtered by organisation
  const latest={}; B.remote.forEach(r=>{ if(B.org&&r.org!==B.org) return; const k=r.rid||r.code; if(!latest[k]||latest[k].t<r.t) latest[k]=r });
  const remoteCodes=Object.values(latest).map(r=>r.code);
  const codes=[...remoteCodes,...B.codes.split(/\s+/).filter(Boolean)]; const res=codes.map(decodeResult).filter(Boolean);
  const orgs=[...new Set(B.remote.map(r=>r.org).filter(Boolean))].sort();
  const remoteBox = ENDPOINT ? `<div class="card stack"><div class="row spread"><h3>Automatiškai surinkti atsakymai</h3><span class="small muted tabular">${B.remote.length} įrašų · ${remoteCodes.length} respondentai${B.org?' · '+esc(B.org):''}</span></div>
      <div class="row"><button class="btn sm" id="rm-fetch">Atnaujinti iš Google Sheets</button><label class="small muted">Organizacija <select id="rm-org"><option value="">Visos</option>${orgs.map(o=>`<option ${B.org===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label><a class="small" href="https://docs.google.com/spreadsheets/d/1rtQ_5sWZ9DgHvV8CRXulxY_lm3LAFxl5H6VTpAuSbh0/edit" target="_blank" rel="noopener">Atidaryti lentelę</a></div>
      ${B.remoteMsg?`<p class="small muted">${esc(B.remoteMsg)}</p>`:''}</div>`
    : `<div class="hint"><b>Automatinis surinkimas dar neįjungtas.</b> Įdiekite Apps Script pagal README (3 min) ir įrašykite Web app URL į <code>ENDPOINT</code>. Kol kas vadovų kodus įklijuokite žemiau.</div>`;
  let body='';
  if(res.length){
    const topicAgg={}; const coreAgg={};
    res.forEach(r=>{ const sc=scoreByTopic(r,r.answers); for(const k in sc){ const o=topicAgg[k]||(topicAgg[k]={sum:0,n:0,resp:0}); o.sum+=sc[k].got/sc[k].max; o.resp++; } CORE.forEach(id=>{ const a=r.answers[id]; if(a===undefined) return; const c=coreAgg[id]||(coreAgg[id]=[0,0,0]); c[a]++; }); });
    const topicRows=Object.entries(topicAgg).sort((a,b)=>b[1].sum/b[1].resp-a[1].sum/a[1].resp).map(([k,o])=>{const p=Math.round(o.sum/o.resp*100);const bb=band(p);const name=k==='core'?'Vadovų komandos veikimas':TOPICS[k].name;return `<div class="bar" style="--bar-c:${bb.c}"><span class="lbl">${esc(name)}</span><span class="val tabular">${p}% · ${bb.name} · ${o.resp} resp.</span><span class="track"><i style="width:${p}%"></i></span></div>`}).join('');
    const coreRows=CORE.filter(id=>coreAgg[id]).map(id=>{const c=coreAgg[id];const n=c[0]+c[1]+c[2];const cons=Math.round(Math.max(...c)/n*100);return `<tr><td class="small">${esc(BY[id].tema)}<br><span class="muted">${esc(BY[id].q)}</span></td><td style="min-width:140px"><div class="dist">${c.map((v,i)=>v?`<i style="width:${v/n*100}%;background:${['var(--good)','var(--warn)','var(--crit)'][i]}" title="${esc(BY[id].opts[i]?.[0]||'')}: ${v}"></i>`:'').join('')}</div></td><td class="c tabular">${c[0]} / ${c[1]} / ${c[2]}</td><td class="c tabular">${cons}%</td></tr>`}).join('');
    const all=Object.values(topicAgg).reduce((a,o)=>{a.s+=o.sum;a.n+=o.resp;return a},{s:0,n:0}); const tot=Math.round(all.s/all.n*100);
    const roleCount={}; res.forEach(r=>{roleCount[r.role]=(roleCount[r.role]||0)+1});
    body=`<div class="kpis"><div class="kpi"><b class="tabular">${res.length}</b><span>respondentai</span></div><div class="kpi"><b class="tabular">${tot}%</b><span>bendra branda · ${band(tot).name}</span></div><div class="kpi"><b class="tabular">${Object.keys(topicAgg).length-1}</b><span>padengtos sritys iš ${Object.keys(TOPICS).length}</span></div><div class="kpi"><b class="tabular">${Object.keys(roleCount).length}</b><span>skirtingi vaidmenys</span></div></div>
      <div><h3>Brandos profilis pagal sritį</h3><p class="small muted">Vidurkis tarp vadovų, kurie vertino sritį.</p></div><div class="card"><div class="bars">${topicRows}</div></div>
      <div><h3>Vadovų komandos sutarimas</h3><p class="small muted">Atsakymų pasiskirstymas į komandos bloko klausimus. Sutarimas = dalis vadovų, pasirinkusių dažniausią atsakymą. Žemas sutarimas yra pati vertingiausia diskusijos tema.</p></div>
      <div class="legend"><span><i style="background:var(--good)"></i>Taip / pilnai</span><span><i style="background:var(--warn)"></i>Iš dalies</span><span><i style="background:var(--crit)"></i>Ne</span></div>
      <div class="tablewrap"><table><thead><tr><th>Klausimas</th><th>Pasiskirstymas</th><th class="c">Taip / iš dalies / ne</th><th class="c">Sutarimas</th></tr></thead><tbody>${coreRows}</tbody></table></div>
      <div class="row"><button class="btn ghost sm" id="agg-csv">Kopijuoti CSV (visi atsakymai)</button><span class="small muted">${res.length} kodai iššifruoti${codes.length>res.length?`, ${codes.length-res.length} neatpažinti`:''}</span></div>`;
  } else body=`<div class="hint">${ENDPOINT?'Spauskite „Atnaujinti iš Google Sheets“, kai vadovai pradės pildyti. ':''}Įklijuokite vadovų atsiųstus kodus (po vieną eilutėje) ir pamatysite komandos vaizdą: brandą pagal sritis ir sutarimą komandos bloke. Pavyzdinis kodas: <button class="btn ghost sm" id="agg-demo">įkelti 3 pavyzdinius kodus</button></div>`;
  return `<div class="stack">
    ${remoteBox}
    <div><h3>${ENDPOINT?'Papildomi kodai (atsarginis kelias)':'Rezultatų kodai'}</h3><p class="small muted">${ENDPOINT?'Jei kuris vadovas atsiuntė kodą rankiniu būdu, įklijuokite jį čia – jis pridedamas prie automatiškai surinktų.':'Kiekvienas vadovas pabaigoje gauna kodą „FBA1-…“. Surinkite juos čia. Kodai saugomi tik šioje naršyklėje.'}</p></div>
    <textarea id="codes" placeholder="FBA1-…">${esc(B.codes)}</textarea>
    <div class="row"><button class="btn sm" id="agg-run">Agreguoti</button><button class="btn ghost sm" id="agg-clear">Išvalyti</button></div>
    ${body}</div>`;
}
function demoCodes(){
  const mk=(role,size,board,pick)=>{ const r=ROLES.find(x=>x.id===role); const prof={role,size,board,topics:matrix()[role],depth:r.depth??3}; const answers={};
    for(let i=0;i<4;i++){ buildPath(prof,answers).forEach(p=>{ if(answers[p.id]===undefined){ const n=BY[p.id].opts.length; answers[p.id]=Math.min(n-1,pick(p.id)) } }) } return encodeResult(prof,answers) };
  const h=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))%97;return x};
  return [mk('ceo','m',true,id=>h(id)%3===0?1:0), mk('cfo','m',true,id=>h(id+'f')%4===0?2:h(id)%2), mk('coo','m',true,id=>h(id+'o')%3)].join('\n');
}
function bindBackend(){
  $('#t-role')?.addEventListener('change',e=>{B.role=e.target.value;renderBackend()});
  $('#t-size')?.addEventListener('change',e=>{B.size=e.target.value;renderBackend()});
  $('#t-board')?.addEventListener('change',e=>{B.board=e.target.value==='1';renderBackend()});
  document.querySelectorAll('.mx').forEach(b=>b.onclick=()=>{const m=matrix();const arr=m[b.dataset.r];const i=arr.indexOf(b.dataset.t);if(i>=0)arr.splice(i,1);else arr.push(b.dataset.t);ls.set('fba_matrix',m);renderBackend()});
  $('#mx-reset')?.addEventListener('click',()=>{ls.del('fba_matrix');renderBackend()});
  $('#f-tema')?.addEventListener('change',e=>{B.filterTema=e.target.value;renderBackend()});
  $('#f-role')?.addEventListener('change',e=>{B.filterRole=e.target.value;renderBackend()});
  $('#agg-run')?.addEventListener('click',()=>{B.codes=$('#codes').value;ls.set('fba_codes',B.codes);renderBackend()});
  $('#rm-org')?.addEventListener('change',e=>{B.org=e.target.value;ls.set('fba_org',B.org);renderBackend()});
  $('#rm-fetch')?.addEventListener('click',async()=>{ B.remoteMsg='Atnaujinama…'; renderBackend(); try{ B.remote=await fetchRemote(''); ls.set('fba_remote',B.remote); B.remoteMsg='Atnaujinta '+new Date().toLocaleTimeString('lt-LT',{hour:'2-digit',minute:'2-digit'}) }catch(e){ B.remoteMsg='Nepavyko pasiekti Google Sheets: '+e.message } renderBackend() });
  $('#agg-clear')?.addEventListener('click',()=>{B.codes='';ls.del('fba_codes');renderBackend()});
  $('#agg-demo')?.addEventListener('click',()=>{B.codes=demoCodes();ls.set('fba_codes',B.codes);renderBackend()});
  $('#agg-csv')?.addEventListener('click',()=>{ const res=B.codes.split(/\s+/).map(decodeResult).filter(Boolean); const lines=['respondentas;vaidmuo;dydis;valdyba;klausimo_id;tema;klausimas;atsakymas;balas'];
    res.forEach((r,i)=>{ for(const id in r.answers){ const q=BY[id]; const o=q.opts[r.answers[id]]; lines.push([i+1,r.role,r.size,r.board?1:0,id,q.tema,q.q,o[0],o[1]].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')) } });
    copyText(lines.join('\n')) });
}

/* ===================== REMOTE (Google Sheets per Apps Script) ===================== */
function setSendStatus(html){ const el=$('#sendstatus'); if(el) el.innerHTML=html }
async function submitResult(payload){
  if(S.sent){ setSendStatus('<p><b style="color:var(--good)">✓ Atsakymai perduoti konsultantui.</b> <span class="small muted">Daugiau nieko daryti nereikia.</span></p>'); return }
  setSendStatus('<p class="small muted">Siunčiame atsakymus konsultantui…</p>');
  try{
    const r=await fetch(ENDPOINT,{method:'POST',body:JSON.stringify(payload)});
    let ok=r.ok; try{ ok=ok&&(await r.json()).ok!==false }catch(e){}
    if(!ok) throw new Error('bad response');
    S.sent=true; save();
    setSendStatus('<p><b style="color:var(--good)">✓ Atsakymai perduoti konsultantui.</b> <span class="small muted">Daugiau nieko daryti nereikia.</span></p>');
  }catch(e){
    setSendStatus('<p><b style="color:var(--warn)">Automatinis siuntimas nepavyko.</b> <span class="small muted">Nukopijuokite žemiau esantį kodą ir atsiųskite konsultantui.</span></p> <p style="margin-top:8px"><button class="btn ghost sm" id="retry">Bandyti dar kartą</button></p>');
    $('#retry')?.addEventListener('click',()=>submitResult(payload));
  }
}
async function fetchRemote(org){
  const u=ENDPOINT+(org?'?org='+encodeURIComponent(org):'');
  const r=await fetch(u); const j=await r.json(); if(!j.ok) throw new Error(j.error||'error'); return j.rows||[];
}
